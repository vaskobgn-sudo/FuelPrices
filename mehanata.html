<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14100c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Механата</title>
<style>
:root{
  --bg:#14100c;
  --wood:#241a12;
  --wood2:#2f2118;
  --wood3:#3b2a1c;
  --line:#4a3524;
  --amber:#e8a33d;
  --amber-d:#b87a24;
  --gold:#ffc76b;
  --candle:#ffd89a;
  --text:#f2e3cb;
  --muted:#a58c6c;
  --dim:#6f5c46;
  --ok:#8fbf6a;
  --bad:#c0603e;
  --tab-h:60px;
  --hdr-h:74px;
}
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  color:var(--text);
  font-size:15px;
  line-height:1.3;
}
img{display:block;pointer-events:none;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
    filter:brightness(.28) saturate(.75);}
#bgTint{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(232,163,61,.10), transparent 60%),
    linear-gradient(180deg, rgba(20,16,12,.72) 0%, rgba(20,16,12,.86) 45%, rgba(20,16,12,.95) 100%);}

/* ---------- shell ---------- */
#app{position:relative;z-index:2;display:flex;flex-direction:column;
  /* JS презаписва това с точния window.innerHeight — dvh не се поддържа
     от по-старите Android WebView-та и там списъците спираха да се скролват */
  height:100vh;height:100dvh;}

header{
  flex:0 0 auto;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:linear-gradient(180deg,rgba(36,26,18,.96),rgba(36,26,18,.80));
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
.hrow1{display:flex;align-items:center;gap:8px;}
#money{font-size:27px;font-weight:800;letter-spacing:-.5px;color:var(--candle);
  text-shadow:0 0 14px rgba(232,163,61,.35);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;}
.hbtns{display:flex;gap:4px;flex:0 0 auto;}
.hbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:11px;
  border:1px solid var(--line);background:rgba(59,42,28,.55);}
.hbtn svg{width:20px;height:20px;fill:none;stroke:var(--amber);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
.hbtn:active{background:rgba(232,163,61,.22);}
.hrow2{display:flex;align-items:center;gap:8px;margin-top:2px;}
#rate{font-size:13px;color:var(--muted);flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#starBox{display:flex;align-items:center;gap:4px;flex:0 0 auto;
  font-size:13px;font-weight:700;color:var(--gold);}
#starBox img{width:18px;height:18px;}
#boostBar{display:none;margin-top:6px;font-size:12px;font-weight:700;
  color:#14100c;background:linear-gradient(90deg,var(--gold),var(--amber));
  border-radius:8px;padding:4px 8px;text-align:center;}
#boostBar.on{display:block;}

main{flex:1 1 auto;position:relative;min-height:0;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0;}
.screen.active{display:flex;}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y;                 /* изрично, вместо да разчитаме на manipulation */
  padding:8px 10px 14px;}

/* ---------- tap zone ---------- */
.tapzone{flex:0 0 auto;display:grid;place-items:center;padding:10px 0 6px;position:relative;}
#tapBtn{width:172px;height:172px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 32%, #6b4a24 0%, #3b2a1c 62%, #241a12 100%);
  border:3px solid var(--amber-d);
  box-shadow:0 0 0 6px rgba(232,163,61,.10), 0 10px 26px rgba(0,0,0,.6),
             inset 0 2px 10px rgba(255,215,150,.16);
  display:grid;place-items:center;transition:transform .07s ease-out;}
#tapBtn img{width:92px;height:92px;margin-bottom:22px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.55));}
#tapBtn .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;
  font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--candle);
  text-shadow:0 1px 3px #000;}
#tapBtn.bump{transform:scale(.93);}
#tapHint{margin-top:2px;font-size:12px;color:var(--muted);text-align:center;}
.float{position:absolute;left:50%;top:44%;transform:translateX(-50%);
  font-size:19px;font-weight:800;color:var(--candle);text-shadow:0 2px 6px #000;
  pointer-events:none;animation:fly .85s ease-out forwards;white-space:nowrap;z-index:5;}
@keyframes fly{0%{opacity:1;transform:translate(-50%,0) scale(.9);}
  25%{transform:translate(-50%,-18px) scale(1.12);}
  100%{opacity:0;transform:translate(-50%,-78px) scale(1);}}

/* ---------- lists ---------- */
.sechead{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--dim);margin:10px 2px 6px;}
.sechead:first-child{margin-top:2px;}
/* подредба по полезност: изгодните горе, купените долу */
#upgList{display:flex;flex-direction:column;}
#upgList .sechead{order:-1;}
#upgList #upgHint{order:99;}

.row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  background:linear-gradient(180deg,rgba(59,42,28,.72),rgba(36,26,18,.72));
  border:1px solid var(--line);border-left:3px solid var(--amber-d);
  border-radius:12px;padding:8px 10px;margin-bottom:8px;min-height:66px;}
.row:active{transform:scale(.985);}
.row.locked{opacity:.42;filter:grayscale(.55);border-left-color:#4a3524;}
.row.poor{opacity:.7;border-left-color:#5b4127;}
.row.done{opacity:.55;border-left-color:var(--ok);}
.row img.ic{width:46px;height:46px;flex:0 0 auto;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
.rmid{flex:1 1 auto;min-width:0;}
.rname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rsub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rprice{font-size:13px;font-weight:800;color:var(--gold);margin-top:2px;}
.row.poor .rprice{color:var(--bad);}
.rright{flex:0 0 auto;text-align:right;min-width:34px;}
.rcount{font-size:22px;font-weight:800;color:var(--candle);line-height:1;}
.rtag{font-size:10px;color:var(--dim);}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{0%{transform:scale(.6) translateY(14px);opacity:0;}
  60%{transform:scale(1.05) translateY(0);opacity:1;}100%{transform:scale(1);}}

/* ---------- panels ---------- */
.panel{background:linear-gradient(180deg,rgba(59,42,28,.7),rgba(36,26,18,.7));
  border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.panel h2{font-size:16px;margin-bottom:8px;color:var(--candle);}
.panel p{font-size:13px;color:var(--muted);margin-bottom:6px;}
.big{font-size:30px;font-weight:800;color:var(--gold);
  display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0;}
.big img{width:30px;height:30px;}
.btn{display:block;width:100%;min-height:52px;border-radius:12px;font-weight:800;
  font-size:16px;border:1px solid var(--amber-d);
  background:linear-gradient(180deg,var(--amber),var(--amber-d));color:#1d1409;
  box-shadow:0 4px 0 #7d5216;margin-top:8px;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d5216;}
.btn[disabled]{opacity:.4;background:#4a3524;color:var(--muted);
  border-color:#4a3524;box-shadow:none;transform:none;}
.btn.ghost{background:rgba(59,42,28,.6);color:var(--text);border-color:var(--line);
  box-shadow:0 4px 0 #1c1309;}
.btn.danger{background:linear-gradient(180deg,#c0603e,#8d3f26);color:#fff;
  border-color:#8d3f26;box-shadow:0 4px 0 #5c2717;}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:14px;
  padding:8px 2px;border-bottom:1px dashed rgba(122,92,62,.35);}
.stat:last-child{border-bottom:none;}
.stat b{color:var(--candle);font-weight:700;text-align:right;white-space:nowrap;}
.stat span{min-width:0;}

.achv{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:7px;background:rgba(36,26,18,.6);}
.achv.got{border-color:var(--ok);background:rgba(80,110,58,.16);}
.achv .amark{width:30px;height:30px;flex:0 0 auto;border-radius:50%;display:grid;
  place-items:center;font-size:15px;font-weight:800;border:1px solid var(--line);
  background:rgba(20,16,12,.7);color:var(--dim);}
.achv.got .amark{color:var(--ok);border-color:var(--ok);}
.achv .an{font-size:14px;font-weight:700;}
.achv .ad{font-size:11.5px;color:var(--muted);}
.achv:not(.got) .an{color:var(--dim);}

/* ---------- tabs ---------- */
nav{flex:0 0 auto;display:flex;
  border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(36,26,18,.96),rgba(20,16,12,.99));
  padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1 1 0;min-height:var(--tab-h);min-width:48px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11.5px;font-weight:700;color:var(--dim);position:relative;padding:6px 2px;}
nav button img,nav button svg{width:24px;height:24px;opacity:.55;}
nav button svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
nav button.active{color:var(--gold);}
nav button.active img,nav button.active svg{opacity:1;}
nav button.active::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;
  border-radius:0 0 3px 3px;background:var(--amber);box-shadow:0 0 10px var(--amber);}
nav button .dot{position:absolute;top:7px;right:30%;width:8px;height:8px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 8px var(--ok);display:none;}
nav button.hasnew .dot{display:block;}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(8,6,4,.78);backdrop-filter:blur(3px);}
#modalRoot.on{display:flex;}
.mbox{width:100%;max-width:340px;max-height:82vh;overflow-y:auto;
  background:linear-gradient(180deg,#3b2a1c,#241a12);
  border:1px solid var(--amber-d);border-radius:16px;padding:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.75);animation:pop .28s ease-out;}
.mbox h3{font-size:19px;color:var(--candle);margin-bottom:10px;}
.mbox .mtxt{font-size:14px;color:var(--text);line-height:1.5;}
.mbox .mtxt em{color:var(--gold);font-style:normal;font-weight:800;}

/* ---------- full overlay screens ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  background:linear-gradient(180deg,#1d150e,#14100c);}
.sheet.on{display:flex;}
.sheethdr{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  border-bottom:1px solid var(--line);background:rgba(36,26,18,.9);}
.sheethdr h2{flex:1 1 auto;font-size:18px;color:var(--candle);}
.xbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--line);font-size:22px;color:var(--amber);}
.sheet .scroll{padding:12px 12px calc(env(safe-area-inset-bottom) + 20px);}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:10px;right:10px;z-index:70;
  top:calc(env(safe-area-inset-top) + 82px);
  display:flex;flex-direction:column;gap:7px;pointer-events:none;align-items:center;}
.toast{max-width:340px;width:100%;
  background:linear-gradient(180deg,#4a3520,#2b1f14);
  border:1px solid var(--amber);border-left:4px solid var(--gold);
  border-radius:11px;padding:7px 11px;box-shadow:0 8px 22px rgba(0,0,0,.6);
  animation:tin .3s ease-out;opacity:.97;}
.toast.out{animation:tout .35s ease-in forwards;}
.toast .tt{font-size:13px;font-weight:800;color:var(--gold);line-height:1.25;}
.toast .td{font-size:11.5px;color:var(--text);line-height:1.25;}
@keyframes tin{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:none;}}
@keyframes tout{to{opacity:0;transform:translateY(-14px);}}

/* ---------- random event ---------- */
#eventHost{position:fixed;right:6px;top:38%;z-index:55;display:none;}
#eventHost.on{display:block;}
#eventBtn{width:74px;height:74px;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle,rgba(255,199,107,.32),rgba(255,199,107,0) 70%);
  animation:wob 1.1s ease-in-out infinite;}
#eventBtn img{width:60px;height:60px;filter:drop-shadow(0 0 12px rgba(255,199,107,.95));}
@keyframes wob{0%,100%{transform:scale(1) rotate(-7deg);}50%{transform:scale(1.14) rotate(7deg);}}

.hint{font-size:12px;color:var(--dim);text-align:center;padding:14px 6px;}
.warn{font-size:12px;color:var(--bad);text-align:center;padding:10px 6px;line-height:1.5;}
@media (max-height:620px){
  #tapBtn{width:150px;height:150px;}
  #tapBtn img{width:78px;height:78px;margin-bottom:20px;}
  #money{font-size:24px;}
}
</style>
</head>
<body>

<div id="bg"></div>
<div id="bgTint"></div>

<div id="app">

  <header>
    <div class="hrow1">
      <div id="money">0 лв.</div>
      <div class="hbtns">
        <button class="hbtn" id="btnStats" aria-label="Статистика">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        </button>
        <button class="hbtn" id="btnSettings" aria-label="Настройки">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
        </button>
      </div>
    </div>
    <div class="hrow2">
      <div id="rate">0 лв./сек</div>
      <div id="starBox"><img id="starIco" alt=""><span id="starNum">0</span></div>
    </div>
    <div id="boostBar"></div>
  </header>

  <main>
    <!-- ===== Механа ===== -->
    <section class="screen active" id="scr-mehana">
      <div class="tapzone">
        <button id="tapBtn" aria-label="Налей ракия">
          <img id="tapIco" alt="">
          <span class="cap">НАЛЕЙ РАКИЯ</span>
        </button>
      </div>
      <div id="tapHint">+0 лв. на тап</div>
      <div class="scroll" id="genList"></div>
    </section>

    <!-- ===== Ъпгрейди ===== -->
    <section class="screen" id="scr-upg">
      <div class="scroll" id="upgList"></div>
    </section>

    <!-- ===== Звезди ===== -->
    <section class="screen" id="scr-star">
      <div class="scroll" id="starPane"></div>
    </section>
  </main>

  <nav>
    <button class="tab active" data-scr="mehana"><img id="tabIcoM" alt="">Механа</button>
    <button class="tab" data-scr="upg">
      <svg viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6"/></svg>Ъпгрейди
      <span class="dot"></span>
    </button>
    <button class="tab" data-scr="star"><img id="tabIcoS" alt="">Звезди<span class="dot"></span></button>
  </nav>
</div>

<!-- ===== Статистика ===== -->
<div class="sheet" id="sheetStats">
  <div class="sheethdr"><h2>Статистика</h2><button class="xbtn" data-close="sheetStats">✕</button></div>
  <div class="scroll" id="statsPane"></div>
</div>

<!-- ===== Настройки ===== -->
<div class="sheet" id="sheetSet">
  <div class="sheethdr"><h2>Настройки</h2><button class="xbtn" data-close="sheetSet">✕</button></div>
  <div class="scroll" id="setPane"></div>
</div>

<div id="toasts"></div>
<div id="modalRoot"><div class="mbox" id="mbox"></div></div>
<div id="eventHost"><button id="eventBtn"><img id="eventIco" alt=""></button></div>

<!-- =================================================================== -->
<!-- =================================================================== -->
<!-- ============== ICONS: BEGIN MEHANA_ASSETS ========================= -->
<!--                                                                     -->
<!--  ЗАМЕСТИТЕЛ. Мрежовият достъп до CloudFront адреса е блокиран от     -->
<!--  egress политиката на тази сесия, затова истинският icons.js не      -->
<!--  можа да бъде свален. Иконите тук са чист SVG (data URI) със         -->
<!--  същите ключове и размери: 192x192, fon = 960x540.                   -->
<!--                                                                     -->
<!--  Нарочно БЕЗ canvas и без toDataURL: четенето от canvas е първото    -->
<!--  нещо, което се чупи в WebView и при отваряне през content:// URI,   -->
<!--  а SVG data URI се рисува навсякъде.                                 -->
<!--                                                                     -->
<!--  ЗА ДА СЛОЖИШ ИСТИНСКИТЕ ИКОНИ: изтрий всичко между този коментар    -->
<!--  и "ICONS: END", и постави дословно съдържанието на icons.js в един  -->
<!--  <script> таг. Нищо друго в файла не се променя.                     -->
<!-- =================================================================== -->
<script>
(function(){
  function S(body,w,h){
    w=w||192;h=h||192;
    return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" '+
      'viewBox="0 0 '+w+' '+h+'">'+body+'</svg>');
  }
  var SH='<ellipse cx="96" cy="174" rx="56" ry="10" fill="rgba(0,0,0,.28)"/>';
  var A={};

  A.rakia=S(SH+
    '<polygon points="26,104 64,104 58,168 32,168" fill="rgba(255,240,215,.30)"/>'+
    '<polygon points="30,128 60,128 55,166 35,166" fill="#e8a33d"/>'+
    '<rect x="105" y="14" width="32" height="16" rx="4" fill="#8d3220"/>'+
    '<rect x="108" y="28" width="26" height="32" fill="rgba(255,240,215,.30)"/>'+
    '<rect x="88" y="54" width="66" height="112" rx="16" fill="rgba(255,240,215,.30)"/>'+
    '<rect x="94" y="86" width="54" height="74" rx="12" fill="#e8a33d"/>'+
    '<rect x="94" y="100" width="54" height="34" rx="4" fill="#f2e3cb"/>'+
    '<rect x="101" y="108" width="40" height="5" rx="2" fill="#b87a24"/>'+
    '<rect x="101" y="119" width="26" height="5" rx="2" fill="#b87a24"/>');

  A.salata=S(SH+
    '<rect x="64" y="58" width="66" height="42" rx="8" fill="#f7f1e4"/>'+
    '<rect x="70" y="52" width="54" height="20" rx="5" fill="#fffdf6"/>'+
    '<ellipse cx="96" cy="98" rx="66" ry="44" fill="#4a6d33"/>'+
    '<ellipse cx="96" cy="92" rx="60" ry="38" fill="#6f9c4f"/>'+
    '<circle cx="60" cy="86" r="8" fill="#b8462f"/>'+
    '<circle cx="126" cy="90" r="8" fill="#b8462f"/>'+
    '<circle cx="88" cy="104" r="7" fill="#7fb05a"/>'+
    '<circle cx="112" cy="72" r="6" fill="#7fb05a"/>'+
    '<circle cx="74" cy="66" r="6" fill="#b8462f"/>'+
    '<rect x="72" y="76" width="46" height="26" rx="5" fill="#fffdf6"/>'+
    '<path d="M30 114 Q96 170 162 114 L150 114 Q96 154 42 114 Z" fill="#2a1c11"/>');

  A.meze=S(SH+
    '<ellipse cx="96" cy="110" rx="74" ry="40" fill="#d9c9ac"/>'+
    '<ellipse cx="96" cy="106" rx="64" ry="33" fill="#f7f1e4"/>'+
    '<polygon points="52,74 84,66 80,84 50,88" fill="#c9a44a"/>'+
    '<circle cx="64" cy="100" r="17" fill="#9b3b2c"/>'+
    '<circle cx="64" cy="100" r="12" fill="#c25541"/>'+
    '<circle cx="92" cy="110" r="17" fill="#7d3a26"/>'+
    '<circle cx="92" cy="110" r="12" fill="#a35236"/>'+
    '<rect x="112" y="88" width="34" height="26" rx="4" fill="#fffbef"/>'+

var SUF=[[1e15,'квдрлн.'],[1e12,'трлн.'],[1e9,'млрд.'],[1e6,'млн.'],[1e3,'хил.']];
function trimZ(s){return s.indexOf('.')>=0?s.replace(/\.?0+$/,''):s;}
function dec(m){return m<10?2:(m<100?1:0);}
function fmt(n){
  if(n===Infinity||n!==n)return '∞';
  if(n<0)return '-'+fmt(-n);
  if(n<1000)return trimZ(n.toFixed(dec(n)));
  if(n>=1e18){var e=Math.floor(Math.log10(n));
    return trimZ((n/Math.pow(10,e)).toFixed(2))+'×10^'+e;}
  for(var i=0;i<SUF.length;i++){
    if(n>=SUF[i][0]){var m=n/SUF[i][0];return trimZ(m.toFixed(dec(m)))+' '+SUF[i][1];}
  }
  return trimZ(n.toFixed(0));
}
function lv(n){return fmt(n)+' лв.';}
function dur(sec){
  sec=Math.floor(sec);
  var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),
      m=Math.floor(sec%3600/60),s=sec%60;
  if(d)return d+' д. '+h+' ч. '+m+' мин.';
  if(h)return h+' ч. '+m+' мин.';
  if(m)return m+' мин. '+s+' сек.';
  return s+' сек.';
}

  // version 0/1 -> current: попълваме липсващи полета, пазим познатите
  var out=d;
  ['money','stars','prestiges','earnedRun','earnedTotal','taps','playtime',
   'peakMoney','bestRate','bestStars','eventsCaught','boostUntil','savedAt'].forEach(function(k){
    if(typeof raw[k]==='number'&&isFinite(raw[k]))out[k]=raw[k];
  });
  if(typeof raw.muted==='boolean')out.muted=raw.muted;
  if(raw.gens)GENS.forEach(function(g){
    var v=raw.gens[g.id];if(typeof v==='number'&&isFinite(v)&&v>=0)out.gens[g.id]=Math.floor(v);});
  if(raw.seen)GENS.forEach(function(g,i){
    out.seen[g.id]=(i<2)||raw.seen[g.id]===true;});
  if(raw.upgrades)UPGRADES.forEach(function(u){if(raw.upgrades[u.id])out.upgrades[u.id]=true;});
  if(raw.achv)ACHV.forEach(function(a){if(raw.achv[a.id])out.achv[a.id]=true;});
  if(out.stars>out.bestStars)out.bestStars=out.stars;
  out.version=SAVE_VERSION;
  return out;
}
// Ако файлът е отворен през content:// (файлов браузър / WebView), origin-ът е
// непрозрачен и localStorage хвърля. Досега това се преглъщаше тихо и играта
// просто не се записваше — затова прогресът се губеше „без причина“.
var storageOK=null, storageErr='';
function testStorage(){
  try{
    localStorage.setItem('__mehana_test','1');
    if(localStorage.getItem('__mehana_test')!=='1')throw new Error('четенето не връща записаното');
    localStorage.removeItem('__mehana_test');
    storageOK=true;
  }catch(e){
    storageOK=false;
    storageErr=(e&&e.name?e.name:'Грешка')+': '+(e&&e.message?e.message:'');
  }
  return storageOK;
}
function save(){
  S.savedAt=Date.now();
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(S));
    if(storageOK===false){storageOK=true;renderAll();}
    return true;
  }catch(e){
    if(storageOK!==false){
      storageOK=false;
      storageErr=(e&&e.name?e.name:'Грешка')+': '+(e&&e.message?e.message:'');
      warnNoStorage();
    }
    return false;
  }
}
function load(){
  var raw=null;
  try{var s=localStorage.getItem(SAVE_KEY);if(s)raw=JSON.parse(s);}catch(e){raw=null;}
  if(!raw)return false;
  S=migrate(raw);
  return true;
}
var warnedStorage=false;
function warnNoStorage(){
  if(warnedStorage)return;
  warnedStorage=true;
  modal({
    title:'Записът не работи',
    html:'Този браузър не дава на страницата да пише в паметта, затова '+
         '<em>прогресът няма да се запази</em>.<br><br>'+
         'Почти винаги причината е, че файлът е отворен през файлов браузър '+
         '(адрес <em>content://</em>). Отвори го директно в Chrome: '+
         'Chrome → менюто ⋮ → «Отвори файл» → mehanata.html. Адресът трябва да '+
         'започва с <em>file://</em>.<br><br>'+
         'Дотогава можеш да пазиш прогреса ръчно от Настройки → «Копирай записа».'+
         '<br><br><span style="opacity:.6;font-size:12px">'+storageErr+'</span>'
  });
}

function upgCount(genId){
  var n=0;
  for(var i=0;i<4;i++)if(S.upgrades[genId+'_'+i])n++;
  return n;
}
function achvCount(){var n=0;for(var k in S.achv)if(S.achv[k])n++;return n;}
function boostActive(){return S.boostUntil>Date.now();}
function globalMult(){
  return (1+STAR_BONUS*S.stars)*(1+ACHV_BONUS*achvCount())*(boostActive()?EVENT_BOOST:1);
}
function genRate(g){                       // приход/сек от целия пост, с всички бонуси
  return S.gens[g.id]*g.rate*Math.pow(2,upgCount(g.id))*globalMult();
}
function totalRate(){
  var t=0;for(var i=0;i<GENS.length;i++)t+=genRate(GENS[i]);return t;
}
function genCost(g,n){                     // цена на следващия екземпляр
  return g.base*Math.pow(COST_GROWTH,(n===undefined?S.gens[g.id]:n));
}
function tapValue(){return Math.max(1,0.02*totalRate());}
function starsFromPrestige(){
  return Math.floor(Math.sqrt(S.earnedRun/PRESTIGE_MIN));
}
function earn(n){
  S.money+=n;S.earnedRun+=n;S.earnedTotal+=n;
  if(S.money>S.peakMoney)S.peakMoney=S.money;
}

var AC=null;
function audio(){
  if(S.muted)return null;
  if(!AC){
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    try{AC=new C();}catch(e){return null;}
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(freq,freq2,dur,type,vol,delay){
  var ac=audio();if(!ac)return;
  var t0=ac.currentTime+(delay||0);
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t0);
  if(freq2&&freq2!==freq)o.frequency.exponentialRampToValueAtTime(freq2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(ac.destination);
  o.start(t0);o.stop(t0+dur+0.03);
}

  achv:function(){[784,988,1175,1568].forEach(function(f,i){tone(f,f,0.16,'sine',0.11,i*0.08);});},
  event:function(){tone(1200,1900,0.18,'sine',0.10);tone(900,1500,0.2,'sine',0.07,0.1);},
  reward:function(){[392,523,659,784,1047].forEach(function(f,i){tone(f,f,0.18,'triangle',0.12,i*0.06);});},
  prestige:function(){[262,330,392,523,659,784].forEach(function(f,i){tone(f,f,0.22,'sine',0.12,i*0.1);});},

function renderGens(){
  var newlyVisible=false;
  GENS.forEach(function(g,i){
    // видимост: първите два винаги; следващият — при 50% от базовата цена
    if(!S.seen[g.id]){
      var prevSeen=(i===0)||S.seen[GENS[i-1].id];
      if(prevSeen&&(S.money>=g.base*0.5||S.gens[g.id]>0)){
        S.seen[g.id]=true;newlyVisible=true;
        if(!booting){                       // при зареждане наваксваме тихо
          SFX.unlock();
          toast('Нов пост: '+g.name,'Вече можеш да го купиш.',3200);
        }
      }
    }
    var r=genRows[g.id];
    if(!S.seen[g.id]){r.el.style.display='none';return;}
    if(r.el.style.display==='none'){
      r.el.style.display='';
      r.el.classList.add('pop');
      setTimeout(function(){r.el.classList.remove('pop');},520);
    }
    var cost=genCost(g),n=S.gens[g.id];
    if(r.cnt.textContent!==String(n))r.cnt.textContent=n;
    r.price.textContent=lv(cost);
    r.sub.textContent = n>0
      ? 'Дава '+fmt(genRate(g))+' лв./сек'
      : 'Ще дава '+fmt(g.rate*globalMult())+' лв./сек';
    var poor=S.money<cost;
    r.el.classList.toggle('poor',poor);
  });
  var hint=$('genHint');
  if(hint)hint.style.display=GENS.every(function(g){return S.seen[g.id];})?'none':'';
  return newlyVisible;
}

function renderUpgs(){
  var avail=0,shown=0;
  UPGRADES.forEach(function(u){
    var g=GEN_BY_ID[u.gen],r=upgRows[u.id];
    var owned=S.gens[u.gen],bought=!!S.upgrades[u.id],unlocked=owned>=u.req;
    var visible=S.seen[u.gen]&&(unlocked||bought||owned>=Math.max(1,u.req/2));
    if(!visible){r.el.style.display='none';return;}
    r.el.style.display='';shown++;
    r.price.textContent=bought?'Купен':lv(u.cost);
    r.sub.textContent='Удвоява прихода от «'+g.name+'»';
    r.el.classList.toggle('done',bought);
    r.el.classList.toggle('locked',!bought&&!unlocked);
    var poor=!bought&&unlocked&&S.money<u.cost;
    r.el.classList.toggle('poor',poor);
    if(bought){r.tag.textContent='✓';r.cnt.textContent='×2';}
    else if(!unlocked){r.tag.textContent='нужни '+u.req;r.cnt.textContent=owned+'/'+u.req;}
    else {r.tag.textContent='';r.cnt.textContent='×2';avail++;}
    // 0 = мога да го купя сега, 1 = отключен но скъп, 2 = още заключен, 3 = купен
    r.el.style.order = bought?3:(!unlocked?2:(poor?1:0));
  });
  var h=$('upgHint');
  if(h)h.textContent=shown?'':'Още няма ъпгрейди. Купи поне 5 бройки от някой пост.';
  // точка на таба
  var canBuy=UPGRADES.some(function(u){
    return !S.upgrades[u.id]&&S.gens[u.gen]>=u.req&&S.money>=u.cost;});
  document.querySelector('nav button[data-scr="upg"]').classList.toggle('hasnew',canBuy);
}

function renderStarPane(){
  var gain=starsFromPrestige();
  $('pStars').textContent=S.stars;
  $('pBonus').textContent='Бонус в момента: +'+(S.stars*STAR_BONUS*100).toFixed(0)+'% към целия приход.';
  $('pInfo').textContent='Продажби до момента: '+S.prestiges+'. Изкарано в този живот: '+lv(S.earnedRun);
  var btn=$('btnPrestige');
  var ok=S.earnedRun>=PRESTIGE_MIN&&gain>0;
  btn.disabled=!ok;
  btn.textContent=ok?('Продай механата за '+gain+' '+plural(gain,'звезда','звезди','звезди')):'Продай механата';
  $('pNeed').textContent=ok?'Нулират се пари, постове и ъпгрейди. Звездите остават.'
    :'Нужни са поне '+lv(PRESTIGE_MIN)+' изкарани в този живот.';
  var n=achvCount();
  $('aCount').textContent=n;
  ACHV.forEach(function(a){
    var d=$('achvList').querySelector('[data-id="'+a.id+'"]');
    if(d)d.classList.toggle('got',!!S.achv[a.id]);
  });
  document.querySelector('nav button[data-scr="star"]').classList.toggle('hasnew',ok);
}

function renderStats(){
  var rows=[
    ['Изиграно време',dur(S.playtime)],
    ['Общо тапвания',S.taps.toLocaleString('bg-BG')],
    ['Най-много пари наведнъж',lv(S.peakMoney)],
    ['Най-добър приход/сек',fmt(S.bestRate)+' лв./сек'],
    ['Изкарано в този живот',lv(S.earnedRun)],
    ['Изкарано за всички животи',lv(S.earnedTotal)],
    ['Приход в момента',fmt(totalRate())+' лв./сек'],
    ['На тап',lv(tapValue())],
    ['Продадени механи',String(S.prestiges)],
    ['Звезди',String(S.stars)+' (рекорд '+S.bestStars+')'],
    ['Бонус от звезди','+'+(S.stars*STAR_BONUS*100).toFixed(0)+'%'],
    ['Постижения',achvCount()+'/'+ACHV.length+' (+'+achvCount()+'%)'],
    ['Уловени звезди',String(S.eventsCaught)],
    ['Купени постове',String(GENS.reduce(function(s,g){return s+S.gens[g.id];},0))],
    ['Купени ъпгрейди',Object.keys(S.upgrades).length+'/'+UPGRADES.length],
    ['Общ множител','×'+globalMult().toFixed(2)]
  ];
  var html='<div class="panel">';
  rows.forEach(function(r){
    html+='<div class="stat"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';
  });
  html+='</div>';
  elStatsPane.innerHTML=html;
}

function renderAll(){
  renderHeader();renderGens();renderUpgs();
  if(curScreen==='star')renderStarPane();
  if($('sheetStats').classList.contains('on'))renderStats();
  var ss=$('setSaved');
  if(ss)ss.textContent='Последен запис: преди '+dur((Date.now()-S.savedAt)/1000);
  var st=$('setStorage');
  if(st){
    if(storageOK===false){
      st.textContent='⚠ Паметта е недостъпна — записът НЕ работи. Отвори файла '+
        'директно в Chrome (адрес file://), не през файловия браузър.';
      st.style.color='var(--bad)';
    }else{
      st.textContent='Паметта работи.';
      st.style.color='var(--ok)';
    }
  }
}
function rebuildAll(){
  buildGenList();buildUpgList();buildStarPane();buildSetPane();
  lastMoneyTxt=lastRateTxt=lastStarTxt='';
  renderAll();renderStarPane();
}

/* =======================================================================
   9. ДЕЙСТВИЯ
   ===================================================================== */
function buyGen(g){
  var cost=genCost(g);
  if(S.money<cost){SFX.err();vibe(6);return;}
  S.money-=cost;S.gens[g.id]++;
  SFX.buy();vibe(12);
  checkAchv();renderAll();save();     // всяка покупка се записва веднага
}
function buyUpg(u){
  if(S.upgrades[u.id]){return;}
  if(S.gens[u.gen]<u.req){SFX.err();return;}
  if(S.money<u.cost){SFX.err();vibe(6);return;}
  S.money-=u.cost;S.upgrades[u.id]=true;
  SFX.unlock();vibe(18);
  toast('Ъпгрейд: '+u.name,'«'+GEN_BY_ID[u.gen].name+'» дава двойно.',3000);
  checkAchv();renderAll();save();
}

function doTap(){
  var v=tapValue();
  earn(v);S.taps++;
  vibe(10);SFX.tap();
  elTapBtn.classList.add('bump');
  setTimeout(function(){elTapBtn.classList.remove('bump');},80);
  var f=document.createElement('div');
  f.className='float';f.textContent='+'+lv(v);
  f.style.left=(42+Math.random()*16)+'%';
  elTapZone.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},900);
  checkAchv();
}
elTapBtn.addEventListener('pointerdown',function(e){e.preventDefault();doTap();});
elTapBtn.addEventListener('contextmenu',function(e){e.preventDefault();});

function askPrestige(){
  var gain=starsFromPrestige();
  if(S.earnedRun<PRESTIGE_MIN||gain<1){SFX.err();return;}
  modal({
    title:'Продай механата',
    html:'Ще получиш <em>'+gain+' '+plural(gain,'звезда','звезди','звезди')+'</em>.<br><br>'+
         'Общо звезди след това: <em>'+(S.stars+gain)+'</em> — това е <em>+'+
         ((S.stars+gain)*STAR_BONUS*100).toFixed(0)+'%</em> към целия приход, завинаги.<br><br>'+
         'Губиш парите, всички постове и всички ъпгрейди. Постиженията и звездите остават.',
    buttons:[
      {label:'Продай я',fn:function(){doPrestige(gain);}},
      {label:'Още не',cls:'ghost'}
    ]
  });
}
function doPrestige(gain){
  S.stars+=gain;S.prestiges++;
  if(S.stars>S.bestStars)S.bestStars=S.stars;
  S.money=0;S.earnedRun=0;S.boostUntil=0;
  GENS.forEach(function(g,i){S.gens[g.id]=0;S.seen[g.id]=(i<2);});
  S.upgrades={};
  SFX.prestige();vibe([20,40,20]);
  checkAchv();save();
  lastMoneyTxt=lastRateTxt=lastStarTxt='';
  renderAll();renderStarPane();
  toast('Механата е продадена','+'+gain+' '+plural(gain,'звезда','звезди','звезди')+'. Наздраве за новото начало!',4000);
}

/* --- постижения --- */
// silent=true при зареждане: наваксваме постиженията от записа без порой от toast-ове
function checkAchv(silent){
  for(var i=0;i<ACHV.length;i++){
    var a=ACHV[i];
    if(!S.achv[a.id]&&a.t()){
      S.achv[a.id]=true;
      if(!silent){
        SFX.achv();vibe(24);
        toast('Постижение: '+a.name,a.desc+' +1% приход.',3600);
      }
    }
  }
}

/* =======================================================================
   10. СЛУЧАЙНИ СЪБИТИЯ
   ===================================================================== */
var eventTimer=null,eventHideTimer=null;
function scheduleEvent(){
  clearTimeout(eventTimer);
  var wait=(EVENT_MIN+Math.random()*(EVENT_MAX-EVENT_MIN))*1000;
  eventTimer=setTimeout(showEvent,wait);
}
function showEvent(){
  elEventHost.classList.add('on');
  elEventHost.style.top=(28+Math.random()*34)+'%';
  SFX.event();
  clearTimeout(eventHideTimer);
  eventHideTimer=setTimeout(function(){
    elEventHost.classList.remove('on');
    scheduleEvent();
  },EVENT_LIFE*1000);
}
$('eventBtn').addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(!elEventHost.classList.contains('on'))return;
  elEventHost.classList.remove('on');
  clearTimeout(eventHideTimer);
  S.eventsCaught++;
  vibe([15,30,15]);SFX.reward();
  if(Math.random()<0.5){
    S.boostUntil=Date.now()+EVENT_BOOST_TIME*1000;
    toast('Гуляй!','×'+EVENT_BOOST+' приход за '+EVENT_BOOST_TIME+' секунди.',4000);
  }else{
    var bonus=Math.max(S.money*EVENT_CASH,totalRate()*30);
    earn(bonus);
    toast('Щедър клиент','Даде ти '+lv(bonus)+' бакшиш.',4000);
  }
  checkAchv();renderAll();save();
  scheduleEvent();
});

/* =======================================================================
   11. ТАБОВЕ И ЕКРАНИ
   ===================================================================== */
var curScreen='mehana';
Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){
  b.addEventListener('click',function(){
    curScreen=b.dataset.scr;
    Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(x){
      x.classList.toggle('active',x===b);});
    Array.prototype.forEach.call(document.querySelectorAll('.screen'),function(s){
      s.classList.toggle('active',s.id==='scr-'+curScreen);});
    if(curScreen==='star')renderStarPane();
    if(curScreen==='upg')renderUpgs();
  });
});
function openSheet(id){
  $(id).classList.add('on');
  if(id==='sheetStats')renderStats();
  if(id==='sheetSet'){refreshMute();renderAll();}
}
$('btnStats').addEventListener('click',function(){openSheet('sheetStats');});
$('btnSettings').addEventListener('click',function(){openSheet('sheetSet');});
Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){
  b.addEventListener('click',function(){$(b.dataset.close).classList.remove('on');});
});

/* =======================================================================
   12. ОФЛАЙН ПРОГРЕС
   ===================================================================== */
function applyAway(seconds,showModal){
  var capped=Math.min(seconds,OFFLINE_CAP);
  var gain=totalRate()*capped*OFFLINE_RATIO;
  if(gain<=0)return 0;
  earn(gain);
  if(showModal){
    modal({
      title:'Докато те нямаше',
      html:'Механата изкара <em>'+lv(gain)+'</em><br><br>'+
           'Отсъствие: '+dur(seconds)+
           (seconds>OFFLINE_CAP?' — начислени са само първите 8 часа':'')+
           '<br>Офлайн се начислява 50% от прихода.'
    });
  }
  return gain;
}

/* =======================================================================
   13. ИГРОВИ ЦИКЪЛ
   ===================================================================== */
// Времето се мери САМО тук, по стенен часовник. Така няма значение дали
// requestAnimationFrame е спрял (заспал телефон, скрит таб) или е бил throttle-нат —
// пропуснатото време се начислява точно веднъж, на следващия кадър.
var lastWall=0,uiAcc=0,saveAcc=0,achvAcc=0;
function loop(){
  requestAnimationFrame(loop);
  var now=Date.now();
  if(!lastWall){lastWall=now;return;}
  var dt=(now-lastWall)/1000;
  lastWall=now;
  if(dt<0)dt=0;                       // преместен назад системен часовник
  if(dt>=OFFLINE_MIN){                // дълга пауза → по офлайн правилата
    applyAway(dt,dt>=MODAL_MIN);
    save();renderAll();
    return;
  }
  var r=totalRate();
  if(r>0)earn(r*dt);
  if(r>S.bestRate)S.bestRate=r;
  S.playtime+=dt;

  uiAcc+=dt;saveAcc+=dt;achvAcc+=dt;
  if(achvAcc>=1){achvAcc=0;checkAchv();}
  if(uiAcc>=0.14){uiAcc=0;renderAll();}
  if(saveAcc>=5){saveAcc=0;save();}
}

/* =======================================================================
   14. ЖИЗНЕН ЦИКЪЛ
   ===================================================================== */
function onHide(){save();}
document.addEventListener('visibilitychange',function(){
  // Само записваме/прерисуваме. Начисляването на пропуснатото време е
  // изцяло работа на loop(), иначе едно и също време се плаща два пъти.
  if(document.visibilityState==='hidden')onHide();
  else renderAll();
});
window.addEventListener('pagehide',onHide);
window.addEventListener('blur',function(){save();});

/* =======================================================================
   15. СТАРТ
   ===================================================================== */
function boot(){
  fitHeight();
  applyAssets();
  testStorage();
  var had=load();
  checkAchv(true);              // наваксване от записа, без toast-ове
  rebuildAll();
  if(had){
    var away=(Date.now()-S.savedAt)/1000;
    if(away>=OFFLINE_MIN)applyAway(away,true);
    else if(away>0)earn(totalRate()*away);
  }
  checkAchv(true);
  renderAll();renderStarPane();
  booting=false;
  scheduleEvent();
  requestAnimationFrame(loop);
  if(storageOK===false)setTimeout(warnNoStorage,600);

  // Първото докосване „отключва“ звука (политика за автоплей в Chrome)
  var unlockAudio=function(){
    if(!S.muted)audio();
    document.removeEventListener('pointerdown',unlockAudio);
  };
  document.addEventListener('pointerdown',unlockAudio);

  // да не се дърпа страницата и да няма pinch-zoom
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  document.addEventListener('dblclick',function(e){e.preventDefault();});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
