name: Update fuel price data

on:
  schedule:
    # 04:20 UTC every day. GitHub queues cron jobs, so the exact minute drifts.
    - cron: "20 4 * * *"
  workflow_dispatch:
  # Rebuild immediately when the scraper itself changes, so a fix is visible
  # without waiting for the next nightly run.
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run parser tests
        run: python scripts/test_parser.py

      - name: Scrape sources and rebuild the dataset
        run: python scripts/fetch_data.py --output data/fuel_prices.json

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/fuel_prices.json; then
            echo "Dataset unchanged - nothing to commit."
            exit 0
          fi

          git add data/fuel_prices.json
          git commit -m "chore(data): refresh fuel prices and minimum wages ($(date -u +%Y-%m-%d))"
          git push
